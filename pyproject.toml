[project]
name = "tax-return-auto"
version = "0.1.0"
description = "Australian company tax workpaper draft generator"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.30,<2",
    "pandas>=2.1,<4",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "google-genai>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
